[project]
name = "atlas-file-manager"
version = "1.9.0"
description = "Scan, identify and mass-rename media files to Plex naming conventions"
requires-python = ">=3.14"

# The single declaration of what the backend needs. Ranges here, exact versions
# and hashes in `uv.lock`; nothing else declares a dependency. Mirrors the
# frontend: pyproject.toml <-> package.json, uv.lock <-> package-lock.json.
dependencies = [
    "diskcache>=5.6.3",
    "fastapi>=0.110.0",
    "filetype>=1.2.0",
    # 4.x, not 3.x: backend/test_parser.py pins the parse output of the 4.x
    # series, and 3.x is a different parser.
    "guessit>=4.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.4",
    "python-multipart>=0.0.9",
    "tenacity>=8.2.3",
    "uvicorn>=0.29.0",
]

[dependency-groups]
# Installed locally and in CI, never in the image: `uv sync --no-dev` skips
# this group entirely.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    # Kept project-scoped on purpose: uv is not installed on this machine, so
    # `.venv/bin/uv` is the only copy. See CLAUDE.md for the bootstrap.
    "uv>=0.12.3",
]

[tool.uv]
# There is no package to build here — `backend/` is imported from the repo
# root, not installed. Without this uv would look for a build backend.
package = false

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".venv", ".cache", "frontend"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "T20",    # flake8-print - print() is not logging
    "RUF",
]
ignore = [
    "B008",       # FastAPI Depends() in defaults is idiomatic
    "E501",       # line length is enforced by `ruff format`, not the linter
    "SIM105",     # try/except/pass reads fine here; contextlib.suppress is not clearer

    # --- Tracked debt: these are real findings, muted only to keep the baseline
    # green. Re-enable the rule in the same commit that clears the debt.
    #
    # TODO(blocking-io): ASYNC240's *suggestion* (trio.Path) does not fit this
    # stack, but its two findings are real blocking filesystem calls on the
    # event loop, both in the async `rename_items`: `old_path.exists()`
    # (main.py:72) and `old_path.rename()` (main.py:85). The fix is
    # `anyio.to_thread.run_sync`, or making the whole endpoint `def` so
    # Starlette runs it in the threadpool. Do it when the rename path is
    # reworked for the auto-move feature, then drop this ignore.
    "ASYNC240",
    #
    # TODO(logging): api_clients.py swallows API failures into print(). The
    # planned auto-move + rollback journal needs real structured logging;
    # convert every print() to a logger call and drop this ignore.
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"backend/test_*.py" = ["T20"]
