services:
  plex-file-manager:
    build: .
    container_name: plex-file-manager
    # Published on 8080; the app inside the container always listens on 8000.
    ports:
      - "${PORT:-8080}:8000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TVDB_API_KEY=${TVDB_API_KEY}
      - TVDB_PIN=${TVDB_PIN}
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-24}
      - LANG_PREFS=${LANG_PREFS:-it,en}
      # Container side of the mount below, and the only tree the app may touch.
      # Deliberately not ${MEDIA_DIR}: that is the host path.
      - MEDIA_ROOT=/media
    volumes:
      - ${MEDIA_DIR}:/media:rw
    restart: unless-stopped
